# Sprachen der Sprachwahl, in dieser Reihenfolge.
# Felder: id (BCP-47), name_eigen, name_de, iso639_1 (STT-Sprachhinweis, null = automatisch), rtl,
#         varietaet_hinweis (für den Systemprompt), status (experimentell → Hinweis-Punkt auf der Kachel),
#         optional stt/llm/tts (überschreiben defaults aus app.yaml), saetze (feste, vorab erzeugte Ansagen):
#         begruessung, fehler, antwort_ansage (vor der Antwort-Aufnahme), danke (wenn keine Rückmeldung gegeben wird),
#         moment (Denk-Laut bei langer Wartezeit).
# ACHTUNG: Die festen Sätze sind noch NICHT muttersprachlich geprüft.

- id: ar
  name_eigen: "العربية"
  name_de: Arabisch
  iso639_1: ar
  rtl: true
  varietaet_hinweis: "Einfaches, alltagsnahes Arabisch, möglichst nah an gesprochener Sprache, kein gehobenes Hocharabisch."
  saetze:
    begruessung: "هل تريد العربية؟ اضغط مرة أخرى."
    fehler: "لم ينجح ذلك. اضغط مرة أخرى."
    antwort_ansage: "قل إجابتك. يمكنك أيضًا تهجئتها حرفًا حرفًا."
    danke: "شكرًا. سمعت إجابتك."
    moment: "لحظة من فضلك."

- id: prs
  name_eigen: "دری"
  name_de: Dari
  iso639_1: fa
  rtl: true
  varietaet_hinweis: "Dari, wie es in Afghanistan gesprochen wird. Kein iranisches Persisch."
  saetze:
    begruessung: "دری می‌خواهی؟ یک بار دیگر لمس کن."
    fehler: "نشد. یک بار دیگر لمس کن."
    antwort_ansage: "جوابت را بگو. می‌توانی حرف به حرف هم بگویی."
    danke: "تشکر. جوابت را شنیدم."
    moment: "یک لحظه صبر کن."

