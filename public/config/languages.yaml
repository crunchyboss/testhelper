- id: ti
  name_eigen: "ትግርኛ"
  name_de: Tigrinya
  iso639_1: ti
  rtl: false
  status: experimentell
  varietaet_hinweis: "Einfaches Tigrinya in Ge'ez-Schrift, wie in Eritrea gesprochen."
  saetze:
    begruessung: "ትግርኛ ትደሊ ዶ? ደጊምካ ጠውቕ።"
    fehler: "ኣይሰርሐን። ደጊምካ ጠውቕ።"
    antwort_ansage: "መልስኻ ተዛረብ። ፊደል ብፊደል'ውን ክትብሎ ትኽእል ኢኻ።"
    danke: "የቐንየለይ። መልስኻ ሰሚዐዮ።"
    moment: "ሓንሳእ ተጸበ።"

- id: kmr
  name_eigen: "Kurmancî"
  name_de: Kurmandschi
  iso639_1: ku
  rtl: false
  status: experimentell      # Sprachenmatrix: Aussprache/Erkennung fraglich
  varietaet_hinweis: "Kurmandschi (Nordkurdisch) in lateinischer Schrift. Nicht Sorani, keine arabische Schrift."
  saetze:
    begruessung: "Tu Kurmancî dixwazî? Dîsa bitikîne."
    fehler: "Ev nebû. Dîsa bitikîne."
    antwort_ansage: "Bersiva xwe bibêje. Tu dikarî tîp bi tîp jî bibêjî."
    danke: "Spas. Min bersiva te bihîst."
    moment: "Hinekî bisekine."

